<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="每 30 分钟提醒你喝水的全屏计时器。">
<meta name="theme-color" content="#08191d">
<title>喝水提醒 · 30 分钟</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08191d;
    --text: #f0f8f5;
    --muted: #a8c3c0;
    --mint: #8af0ce;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
  .shell {
    min-height: 100vh; min-height: 100dvh;
    display: grid; grid-template-rows: auto 1fr auto; gap: 1.25rem;
    padding: clamp(1rem, 4vw, 3rem);
    background: radial-gradient(ellipse at 50% 46%, #16413d, var(--bg) 68%);
  }
  header, footer { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
  .brand, .actions { display: flex; align-items: center; gap: .7rem; }
  .brand { font-weight: 650; white-space: nowrap; }
  .brand svg { width: 1.15em; height: 1.15em; color: var(--mint); }
  main { display: grid; place-items: center; text-align: center; }
  .panel { display: grid; justify-items: center; gap: clamp(.8rem, 2vh, 1.5rem); }
  .ring { display: grid; place-items: center; position: relative; width: min(72vw, 46dvh, 25rem); min-width: 12rem; aspect-ratio: 1; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { stroke: #335651; }
  .progress { stroke: var(--mint); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
  .count { position: relative; display: grid; gap: .3rem; }
  .time { font-size: clamp(2.9rem, min(15vw, 11dvh), 6.8rem); line-height: 1; letter-spacing: -.07em; font-weight: 300; font-variant-numeric: tabular-nums; }
  .label, .status, footer { font-size: .9rem; color: var(--muted); }
  .status { color: var(--mint); }
  .alert-icon { width: clamp(3.5rem, 12dvh, 7rem); height: auto; color: var(--mint); filter: drop-shadow(0 0 1.8rem #8af0ce55); }
  h1 { margin: 0; font-size: clamp(2.8rem, 10vw, 6.5rem); letter-spacing: -.06em; line-height: 1.1; }
  p { margin: 0; }
  button { border: 1px solid #75958f55; border-radius: 99rem; padding: .65rem 1rem; background: #f2fff210; color: var(--text); font: inherit; cursor: pointer; }
  button:hover { background: #f2fff222; }
  button:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }
  .primary { background: var(--mint); border-color: var(--mint); color: #11362e; font-weight: 700; }
  .primary:hover { background: #acf8e0; }
  .actions { justify-content: center; flex-wrap: wrap; }
  @media (max-width: 500px) { footer { align-items: flex-start; } footer p { max-width: 13rem; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C9 6 4.5 10.5 4.5 15A7.5 7.5 0 0 0 19.5 15C19.5 10.5 15 6 12 2Z"/></svg>喝水提醒</div>
    <button id="fullscreen">进入全屏</button>
  </header>
  <main>
    <section class="panel" id="countdown" aria-label="喝水倒计时">
      <div class="ring">
        <svg viewBox="0 0 200 200" fill="none" stroke-width="2" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="96"/>
          <circle class="progress" id="progress" cx="100" cy="100" r="96" pathLength="100"/>
        </svg>
        <div class="count">
          <span class="label">距下次喝水</span>
          <span class="time" id="time" role="timer" aria-live="off">30:00</span>
          <span class="status" id="status" role="status">准备开始</span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="start">开始并全屏</button>
        <button class="primary" id="pause" hidden>暂停计时</button>
        <button id="restart" hidden>重新计时</button>
      </div>
    </section>
    <section class="panel" id="alert" aria-labelledby="alert-title" hidden>
      <svg class="alert-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C9 6 4.5 10.5 4.5 15A7.5 7.5 0 0 0 19.5 15C19.5 10.5 15 6 12 2Z"/></svg>
      <h1 id="alert-title" role="alert">该喝水了</h1>
      <p class="label">休息一会儿，喝几口水。</p>
      <div class="actions">
        <button class="primary" id="done">喝完了</button>
        <button id="snooze">5 分钟后提醒</button>
      </div>
    </section>
  </main>
  <footer><p id="hint">每 30 分钟提醒 · 请保持网页打开</p><button id="sound" aria-pressed="true">铃声开</button></footer>
</div>
<script>
  const interval = 30 * 60 * 1000;
  const byId = (id) => document.getElementById(id);
  const time = byId("time");
  const status = byId("status");
  const hint = byId("hint");
  const start = byId("start");
  const pause = byId("pause");
  const restart = byId("restart");
  const progress = byId("progress");
  const fullscreen = byId("fullscreen");
  const sound = byId("sound");
  const countdown = byId("countdown");
  const alert = byId("alert");
  const done = byId("done");
  let deadline = null;
  let remaining = interval;
  let started = false;
  let soundOn = true;
  let audio;

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {
      hint.textContent = "此浏览器未开启全屏，请使用浏览器的全屏功能。";
    }
  }

  function unlockSound() {
    try {
      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      if (!AudioEngine) return;
      audio ??= new AudioEngine();
      if (audio.state !== "running") audio.resume().catch(() => {});
    } catch {
      hint.textContent = "此浏览器无法播放铃声，屏幕提醒仍会显示。";
    }
  }

  function playChime() {
    if (!soundOn || audio?.state !== "running") return;
    [523.25, 659.25, 783.99].forEach((pitch, index) => {
      const onset = audio.currentTime + index * 0.19;
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = "sine";
      tone.frequency.value = pitch;
      volume.gain.setValueAtTime(0.001, onset);
      volume.gain.exponentialRampToValueAtTime(0.15, onset + 0.025);
      volume.gain.exponentialRampToValueAtTime(0.001, onset + 0.65);
      tone.connect(volume).connect(audio.destination);
      tone.start(onset);
      tone.stop(onset + 0.68);
    });
  }

  function setReminder(visible) {
    if (alert.hidden === !visible) return;
    alert.hidden = !visible;
    countdown.hidden = visible;
    document.title = visible ? "该喝水了" : "喝水提醒 · 30 分钟";
    if (visible && !document.hidden) done.focus();
  }

  function begin(duration = interval) {
    started = true;
    remaining = duration;
    deadline = Date.now() + duration;
    setReminder(false);
    start.hidden = true;
    pause.hidden = false;
    restart.hidden = false;
    update();
  }

  function update() {
    const now = Date.now();
    if (deadline !== null) {
      remaining = Math.max(0, deadline - now);
      if (remaining === 0) {
        deadline = now + interval;
        remaining = interval;
        setReminder(true);
        playChime();
      }
    }
    const seconds = Math.ceil(remaining / 1000);
    const label = [Math.floor(seconds / 60), seconds % 60].map((part) => String(part).padStart(2, "0")).join(":");
    if (time.textContent !== label) time.textContent = label;
    progress.style.strokeDashoffset = String(100 * (1 - remaining / interval));
    const state = !started ? "准备开始" : deadline === null ? "已暂停" : "计时中";
    if (status.textContent !== state) status.textContent = state;
    pause.textContent = deadline === null ? "继续计时" : "暂停计时";
  }

  start.addEventListener("click", () => {
    unlockSound();
    if (!document.fullscreenElement) void toggleFullscreen();
    begin();
  });
  fullscreen.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    fullscreen.textContent = document.fullscreenElement ? "退出全屏" : "进入全屏";
  });
  pause.addEventListener("click", () => {
    update();
    if (!alert.hidden) return;
    deadline = deadline === null ? Date.now() + remaining : null;
    update();
  });
  restart.addEventListener("click", () => begin());
  done.addEventListener("click", () => { begin(); pause.focus(); });
  byId("snooze").addEventListener("click", () => { begin(5 * 60 * 1000); pause.focus(); });
  sound.addEventListener("click", () => {
    soundOn = !soundOn;
    if (soundOn) unlockSound();
    sound.textContent = soundOn ? "铃声开" : "铃声关";
    sound.setAttribute("aria-pressed", String(soundOn));
  });
  document.addEventListener("visibilitychange", update);
  window.addEventListener("pageshow", update);
  setInterval(update, 250);
</script>
</body>
</html>
